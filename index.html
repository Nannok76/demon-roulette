<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GD Demon Roulette PRO</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            animation: glowPulse 2s infinite alternate;
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.3)); }
            100% { filter: drop-shadow(0 0 25px rgba(0, 255, 0, 0.8)); }
        }

        .site-logo { height: 70px; width: auto; }

        h1 {
            font-family: 'Righteous', cursive;
            color: #fff;
            font-size: 46px;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffaa00, 4px 4px 0px #000;
            margin: 0;
            letter-spacing: 2px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.7);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8), inset 0 0 2px rgba(255,255,255,0.2);
            border: 2px solid #334155;
            backdrop-filter: blur(10px);
        }

        .target-box {
            background: linear-gradient(90deg, #111, #222, #111);
            border: 2px solid #ffcc00;
            display: inline-block;
            padding: 12px 35px;
            border-radius: 15px;
            font-family: 'Righteous', cursive;
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2), inset 0 0 15px rgba(255, 204, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- НОВАЯ КРУТАЯ РУЛЕТКА --- */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background: #09090b;
            border-radius: 15px;
            border: 3px solid #475569;
            overflow: hidden;
            box-shadow: inset 0 0 30px #000;
            margin-bottom: 30px;
        }

        /* Затемнение по краям рулетки */
        .roulette-wrapper::before, .roulette-wrapper::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 80px;
            z-index: 5;
            pointer-events: none;
        }
        .roulette-wrapper::before {
            left: 0;
            background: linear-gradient(to right, #09090b 10%, transparent 100%);
        }
        .roulette-wrapper::after {
            right: 0;
            background: linear-gradient(to left, #09090b 10%, transparent 100%);
        }

        /* Центральный прицел */
        .selector-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #fff;
            z-index: 10;
            transform: translateX(-50%);
            box-shadow: 0 0 15px 2px #fff, 0 0 30px 5px #22c55e;
            border-radius: 2px;
        }

        #roulette-track {
            display: flex;
            height: 100%;
            width: max-content;
            /* Анимация прокрутки настраивается через JS */
            will-change: transform;
        }

        /* Карточка демона */
        .demon-card {
            width: 220px; /* Фиксированная ширина для ровной прокрутки */
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border-right: 2px solid #27272a;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.5) 100%);
        }

        .level-name {
            font-family: 'Righteous', cursive;
            font-size: 26px;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 2px 2px #000;
            word-break: break-word;
            line-height: 1.1;
        }

        .level-author {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .difficulty {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 6px;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.7);
            border: 1px solid currentColor;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Цвета */
        .extreme { color: #ef4444; text-shadow: 0 0 8px #ef4444; border-color: #ef4444; }
        .insane { color: #d946ef; text-shadow: 0 0 8px #d946ef; border-color: #d946ef; }
        .hard { color: #f87171; text-shadow: 0 0 8px #f87171; border-color: #f87171; }
        .medium { color: #facc15; text-shadow: 0 0 8px #facc15; border-color: #facc15; }
        .easy { color: #38bdf8; text-shadow: 0 0 8px #38bdf8; border-color: #38bdf8; }

        /* Заглушка до загрузки */
        #status-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #09090b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Righteous', cursive;
            font-size: 24px;
            color: #94a3b8;
            z-index: 20;
        }

        /* Кнопки */
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Righteous', cursive;
            border: none;
            padding: 16px 40px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.15s all ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-roll {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            color: white;
            box-shadow: 0 6px 0 #1e3a8a, 0 15px 20px rgba(0,0,0,0.4);
        }

        .btn-roll:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #1e3a8a, 0 5px 10px rgba(0,0,0,0.4);
        }

        .btn-done {
            background: linear-gradient(to bottom, #22c55e, #15803d);
            color: white;
            box-shadow: 0 6px 0 #14532d, 0 15px 20px rgba(0,0,0,0.4);
            display: none;
        }

        .btn-done:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #14532d, 0 5px 10px rgba(0,0,0,0.4);
        }

        /* История */
        .history-panel {
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #334155;
        }

        .history-panel h3 { margin-top: 0; text-align: center; color: #cbd5e1; }
        .history-item { padding: 10px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;}
        .history-percent { font-weight: bold; color: #ffcc00; font-size: 18px;}

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>

<body>

    <div class="header-container">
        <img src="images.jpg" alt="Demon Troll" class="site-logo" />
        <h1>DEMON ROULETTE</h1>
    </div>

    <div class="container">
        <div class="target-box">ЦЕЛЬ: <span id="target-percent">1</span>%</div>

        <div class="roulette-wrapper" id="roulette-window">
            <div class="selector-line"></div>
            <div id="status-overlay">Подключение к Базе Данных...</div>
            <div id="roulette-track">
                </div>
        </div>

        <div class="controls">
            <button id="btn-roll" class="btn-roll" disabled>ЗАГРУЗКА...</button>
            <button id="btn-done" class="btn-done">ПРОЙДЕНО!</button>
        </div>

        <div class="history-panel">
            <h3>ИСТОРИЯ ПРОХОЖДЕНИЙ</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        const TABLE_ID = "984514";
        const API_TOKEN = "lLeay1kQEgI8lOf5IEhdSq7iHoqhHJCy";

        let demons = [];
        let currentTarget = 1;
        let currentLevel = null;
        let isRolling = false;

        const fallbackDemons = [
            { name: "Bloodbath", author: "by Riot", diff: "Extreme Demon" },
            { name: "Cataclysm", author: "by Ggb0y", diff: "Extreme Demon" },
            { name: "Nine Circles", author: "by Zobros", diff: "Hard Demon" },
            { name: "B", author: "by Motleyorc", diff: "Medium Demon" },
            { name: "Clubstep", author: "by RobTop", diff: "Easy Demon" }
        ];

        function getDiffClass(difficulty) {
            const d = difficulty.toLowerCase();
            if (d.includes("extreme")) return "extreme";
            if (d.includes("insane")) return "insane";
            if (d.includes("hard")) return "hard";
            if (d.includes("medium")) return "medium";
            return "easy";
        }

        function prepareDemons(list) {
            return list.map(level => ({
                name: level.name || level.Name || "Без названия",
                author: level.author || level.Author || "by Unknown",
                diff: level.diff || level.Difficulty || "Easy Demon",
                class: getDiffClass(level.diff || level.Difficulty || "Easy Demon")
            }));
        }

        async function loadDemons() {
            try {
                const response = await fetch(`https://api.baserow.io/api/database/rows/table/${TABLE_ID}/?user_field_names=true`, {
                    headers: { Authorization: `Token ${API_TOKEN}` }
                });
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                if (!data.results || data.results.length === 0) throw new Error("Empty database");
                
                demons = prepareDemons(data.results);
                setReadyState();
            } catch (error) {
                demons = prepareDemons(fallbackDemons);
                document.getElementById("status-overlay").innerText = "API ОШИБКА • ЛОКАЛЬНАЯ БАЗА";
                setTimeout(setReadyState, 1500);
            }
        }

        function setReadyState() {
            document.getElementById("status-overlay").style.display = "none";
            const rollBtn = document.getElementById("btn-roll");
            rollBtn.disabled = false;
            rollBtn.innerText = "КРУТИТЬ РУЛЕТКУ";
            
            // Ставим стартовую заглушку
            const track = document.getElementById("roulette-track");
            track.innerHTML = createCardHTML({name: "ГОТОВ?", author: "Жми кнопку", diff: "???", class: ""});
            track.style.justifyContent = "center";
            track.style.width = "100%";
        }

        function createCardHTML(level) {
            return `
                <div class="demon-card">
                    <div class="level-name">${level.name}</div>
                    <div class="level-author">${level.author}</div>
                    <div class="difficulty ${level.class}">${level.diff}</div>
                </div>
            `;
        }

        function randomLevel() {
            return demons[Math.floor(Math.random() * demons.length)];
        }

        function rollDemon() {
            if (isRolling || currentTarget > 100) return;
            isRolling = true;

            const rollBtn = document.getElementById("btn-roll");
            const doneBtn = document.getElementById("btn-done");
            const track = document.getElementById("roulette-track");
            const windowEl = document.getElementById("roulette-window");

            rollBtn.disabled = true;
            doneBtn.style.display = "none";

            // Сбрасываем трек
            track.style.transition = "none";
            track.style.transform = "translateX(0)";
            track.style.justifyContent = "flex-start";
            track.style.width = "max-content";
            track.innerHTML = "";

            // Настройки анимации
            const totalCards = 50; // Сколько карточек пролетит
            const winningIndex = 43; // Индекс победной карточки
            const cardWidth = 220; // Ширина .demon-card из CSS

            let trackHTML = "";
            for (let i = 0; i < totalCards; i++) {
                let lvl = randomLevel();
                if (i === winningIndex) {
                    currentLevel = lvl; // Сохраняем победный уровень
                }
                trackHTML += createCardHTML(lvl);
            }
            track.innerHTML = trackHTML;

            // Принудительный рендер перед запуском анимации
            track.offsetHeight; 

            // Вычисляем смещение
            // Нам нужно, чтобы winningIndex оказался ровно по центру окна
            const windowWidth = windowEl.clientWidth;
            const centerOffset = (windowWidth / 2) - (cardWidth / 2);
            
            // Добавим немного рандома, чтобы не всегда останавливалось ровно по центру карточки
            const randomNudge = Math.floor(Math.random() * (cardWidth - 40)) - ((cardWidth - 40) / 2);
            
            const finalPosition = (winningIndex * cardWidth) - centerOffset + randomNudge;

            // Запускаем плавное вращение (7 секунд, с замедлением в конце)
            track.style.transition = "transform 7s cubic-bezier(0.05, 0.9, 0.1, 1)";
            track.style.transform = `translateX(-${finalPosition}px)`;

            // Ждем завершения анимации
            setTimeout(() => {
                isRolling = false;
                rollBtn.disabled = false;
                rollBtn.innerText = "СКИП (ПЕРЕКРУТИТЬ)";
                doneBtn.style.display = "inline-block";
                
                // Подсвечиваем победную рамку
                document.querySelectorAll('.demon-card')[winningIndex].style.background = "linear-gradient(180deg, rgba(34,197,94,0.2) 0%, rgba(0,0,0,0.8) 100%)";
                document.querySelectorAll('.demon-card')[winningIndex].style.border = "2px solid #22c55e";

            }, 7000); // 7000мс = 7 секунд
        }

        function completeLevel() {
            if (!currentLevel) return;

            const history = document.getElementById("history-list");
            const shortDiff = currentLevel.diff.split(' ')[0];

            history.innerHTML = `
                <div class="history-item">
                    <span>
                        <span class="difficulty ${currentLevel.class}" style="font-size:10px; padding:2px 6px; margin-right:10px;">${shortDiff}</span>
                        ${currentLevel.name}
                    </span>
                    <span class="history-percent">${currentTarget}%</span>
                </div>
            ` + history.innerHTML;

            currentTarget++;
            document.getElementById("target-percent").innerText = currentTarget > 100 ? "GG!" : currentTarget;
            document.getElementById("btn-done").style.display = "none";
            document.getElementById("btn-roll").innerText = "КРУТИТЬ РУЛЕТКУ";
        }

        window.onload = loadDemons;
    </script>
</body>
</html>
