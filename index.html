<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Demon Roulette</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            font-family: 'Righteous', cursive;
            color: #ffcc00;
            font-size: 36px;
            text-shadow: 3px 3px 0px #000, 0 0 15px rgba(255, 204, 0, 0.5);
            margin-bottom: 10px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(30, 30, 40, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
            border: 3px solid #334155;
            backdrop-filter: blur(5px);
        }
        .target-box {
            background: #000;
            border: 2px solid #ffcc00;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 12px;
            font-family: 'Righteous', cursive;
            font-size: 24px;
            color: #ffcc00;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.3);
        }
        #roulette-box {
            margin: 20px 0;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #475569;
            transition: all 0.3s ease;
        }
        .level-name {
            font-family: 'Righteous', cursive;
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 2px 2px #000;
        }
        .level-author {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }
        .difficulty {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 5px 15px;
            border-radius: 8px;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.5);
            border: 1px solid currentColor;
        }
        
        /* Цвета сложностей */
        .extreme { color: #ff3333; text-shadow: 0 0 5px #ff3333; }
        .insane { color: #ff33ff; text-shadow: 0 0 5px #ff33ff; }
        .hard { color: #ff6666; text-shadow: 0 0 5px #ff6666; }
        .medium { color: #ffcc66; text-shadow: 0 0 5px #ffcc66; }
        .easy { color: #66ccff; text-shadow: 0 0 5px #66ccff; }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            font-family: 'Righteous', cursive;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-roll {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 6px #1d4ed8;
        }
        .btn-roll:active {
            box-shadow: 0 0px #1d4ed8;
            transform: translateY(6px);
        }
        .btn-roll:disabled {
            background-color: #475569;
            box-shadow: 0 6px #334155;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-done {
            background-color: #22c55e;
            color: white;
            box-shadow: 0 6px #15803d;
            display: none;
        }
        .btn-done:active {
            box-shadow: 0 0px #15803d;
            transform: translateY(6px);
        }

        .history-panel {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .history-panel h3 {
            font-family: 'Righteous', cursive;
            margin-top: 0;
            color: #94a3b8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }
        .history-item {
            padding: 8px 10px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-percent {
            font-weight: bold;
            color: #ffcc00;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e24; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>DEMON ROULETTE</h1>
    
    <div class="container">
        <div class="target-box">
            ЦЕЛЬ: <span id="target-percent">1</span>%
        </div>
        
        <div id="roulette-box">
            <div id="status-text" class="level-name" style="color: #94a3b8;">Подключение к базе данных...</div>
        </div>

        <div class="controls">
            <button id="btn-roll" class="btn-roll" onclick="rollDemon()" disabled>Загрузка...</button>
            <button id="btn-done" class="btn-done" onclick="completeLevel()">Пройдено!</button>
        </div>

        <div class="history-panel">
            <h3>ИСТОРИЯ ПРОХОЖДЕНИЙ</h3>
            <div id="history-list">
                </div>
        </div>
    </div>

    <script>
        // Твои настройки Baserow
        const TABLE_ID = "984514";
        const API_TOKEN = "lLeay1kQEgI8lOf5IEhdSq7iHoqhHJCy";
        
        let demons = [];
        let currentTarget = 1;
        let currentLevel = null;
        let isRolling = false;

        window.onload = async function() {
            const statusText = document.getElementById('status-text');
            const btnRoll = document.getElementById('btn-roll');
            
            try {
                const response = await fetch(`https://api.baserow.io/api/database/rows/table/${TABLE_ID}/?user_field_names=true`, {
                    headers: {
                        "Authorization": `Token ${API_TOKEN}`
                    }
                });
                
                if (!response.ok) throw new Error("Ошибка при запросе к Baserow");
                
                const data = await response.json();
                
                demons = data.results.map(row => {
                    const diffName = row.Difficulty || "Easy Demon";
                    return {
                        name: row.Name || "Без названия",
                        author: row.Author || "by Unknown",
                        diff: diffName,
                        class: getDifficultyClass(diffName)
                    };
                });

                if (demons.length === 0) {
                    statusText.innerText = "Таблица пуста! Добавь уровни.";
                } else {
                    statusText.innerText = "Нажми \"КРУТИТЬ\"";
                    btnRoll.disabled = false;
                    btnRoll.innerText = "Крутить";
                }
                
            } catch (error) {
                console.error(error);
                statusText.innerText = "Ошибка загрузки данных!";
                statusText.style.color = "#ff3333";
            }
        };

        function getDifficultyClass(diff) {
            const d = diff.toLowerCase();
            if (d.includes('extreme')) return 'extreme';
            if (d.includes('insane')) return 'insane';
            if (d.includes('hard')) return 'hard';
            if (d.includes('medium')) return 'medium';
            return 'easy';
        }

        function rollDemon() {
            if (isRolling || demons.length === 0 || currentTarget > 100) return;
            isRolling = true;
            
            const displayBox = document.getElementById('roulette-box');
            const btnRoll = document.getElementById('btn-roll');
            const btnDone = document.getElementById('btn-done');
            
            btnRoll.disabled = true;
            btnDone.style.display = 'none';
            displayBox.style.borderColor = '#475569';
            
            let counter = 0;
            const interval = setInterval(() => {
                const randomTemp = demons[Math.floor(Math.random() * demons.length)];
                displayBox.innerHTML = `<div class="level-name" style="color: #fff;">${randomTemp.name}</div>`;
                counter++;
                
                if (counter > 12) {
                    clearInterval(interval);
                    currentLevel = demons[Math.floor(Math.random() * demons.length)];
                    displayBox.innerHTML = `
                        <div class="level-name">${currentLevel.name}</div>
                        <div class="level-author">${currentLevel.author}</div>
                        <div class="difficulty ${currentLevel.class}">${currentLevel.diff}</div>
                    `;
                    displayBox.style.borderColor = '#ffcc00';
                    
                    isRolling = false;
                    btnRoll.disabled = false;
                    btnRoll.innerText = "ПЕРЕКРУТИТЬ (СКИП)";
                    btnDone.style.display = 'block';
                }
            }, 50);
        }

        function completeLevel() {
            if (!currentLevel || currentTarget > 100) return;

            const historyList = document.getElementById('history-list');
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            
            const shortDiff = currentLevel.diff.split(' ')[0];
            
            historyItem.innerHTML = `
                <span><span class="difficulty ${currentLevel.class}" style="font-size:10px; padding:2px 5px; margin-right:8px;">${shortDiff}</span> ${currentLevel.name}</span>
                <span class="history-percent">${currentTarget}%</span>
            `;
            historyList.insertBefore(historyItem, historyList.firstChild);

            currentTarget++;
            
            if (currentTarget > 100) {
                document.getElementById('target-percent').innerText = "GG!";
                document.getElementById('roulette-box').innerHTML = `<div class="level-name" style="color: #22c55e;">РУЛЕТКА ПРОЙДЕНА!</div>`;
                document.getElementById('btn-roll').style.display = 'none';
                document.getElementById('btn-done').style.display = 'none';
            } else {
                document.getElementById('target-percent').innerText = currentTarget;
                document.getElementById('roulette-box').innerHTML = `<div class="level-name" style="color: #94a3b8;">ГОТОВ К ${currentTarget}%?</div>`;
                document.getElementById('roulette-box').style.borderColor = '#475569';
                document.getElementById('btn-roll').innerText = "КРУТИТЬ";
                document.getElementById('btn-done').style.display = 'none';
                currentLevel = null;
            }
        }
    </script>

</body>
</html>
