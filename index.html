<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GD Demon Roulette CS:GO Edition</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');

        * { box-sizing: border-box; }

        body {
            background: radial-gradient(circle at center, #1e2024 0%, #0d0e12 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .site-logo { height: 70px; filter: drop-shadow(0 0 15px rgba(34, 197, 94, 0.6)); }

        h1 {
            font-family: 'Righteous', cursive;
            color: #fff;
            font-size: 46px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5), 3px 3px 0px #000;
            margin: 0;
            letter-spacing: 2px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(20, 22, 28, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid #2a2d35;
        }

        .target-box {
            background: #111318;
            border: 1px solid #475569;
            border-bottom: 3px solid #22c55e;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 8px;
            font-family: 'Righteous', cursive;
            font-size: 26px;
            color: #fff;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }
        
        #target-percent { color: #22c55e; }

        /* --- РУЛЕТКА CS:GO --- */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background: #111318;
            border-radius: 4px;
            border: 1px solid #000;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
            margin-bottom: 30px;
        }

        /* Тени по бокам для эффекта глубины */
        .roulette-wrapper::before, .roulette-wrapper::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 100px;
            z-index: 5;
            pointer-events: none;
        }
        .roulette-wrapper::before { left: 0; background: linear-gradient(to right, #111318 10%, transparent 100%); }
        .roulette-wrapper::after { right: 0; background: linear-gradient(to left, #111318 10%, transparent 100%); }

        /* Желтая линия по центру как в КС */
        .selector-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ffcc00;
            z-index: 10;
            transform: translateX(-50%);
            box-shadow: 0 0 10px 2px rgba(255, 204, 0, 0.8);
        }

        #roulette-track {
            display: flex;
            height: 100%;
            width: max-content;
            /* Плавность зависит от видеокарты, will-change помогает */
            will-change: transform;
        }

        /* Карточка демона (Скин) */
        .demon-card {
            width: 220px; /* Строго фиксированная ширина */
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: linear-gradient(180deg, #1e2026 0%, #16181d 100%);
            border-right: 1px solid #0d0e12;
            border-bottom: 6px solid #555; /* Линия редкости */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            position: relative;
        }

        .level-name {
            font-family: 'Righteous', cursive;
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px #000;
            word-break: break-word;
            z-index: 2;
        }

        .level-author {
            font-size: 14px;
            color: #718096;
            margin-bottom: 15px;
            z-index: 2;
        }

        /* Цвета редкости CS:GO */
        .extreme { border-bottom-color: #eb4b4b; } /* Тайное (Красный) */
        .insane { border-bottom-color: #d32ce6; } /* Засекреченное (Розовый) */
        .hard { border-bottom-color: #8847ff; } /* Запрещенное (Фиолетовый) */
        .medium { border-bottom-color: #4b69ff; } /* Армейское (Синий) */
        .easy { border-bottom-color: #5e98d9; } /* Промышленное (Голубой) */

        /* Плашка сложности внутри карточки */
        .diff-badge {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0,0,0,0.6);
            color: #e2e8f0;
            z-index: 2;
        }

        #status-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111318;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Righteous', cursive;
            font-size: 24px;
            color: #94a3b8;
            z-index: 20;
        }

        .controls { display: flex; gap: 20px; justify-content: center; }

        button {
            font-family: 'Righteous', cursive;
            border: none;
            padding: 15px 35px;
            font-size: 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-roll {
            background: #3b82f6;
            box-shadow: 0 4px 0 #1e3a8a;
        }
        .btn-roll:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }

        .btn-done {
            background: #22c55e;
            box-shadow: 0 4px 0 #14532d;
            display: none;
        }
        .btn-done:active { transform: translateY(4px); box-shadow: none; }

        .history-panel {
            margin-top: 30px;
            background: #16181d;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #2a2d35;
        }
        .history-item { padding: 10px; border-bottom: 1px solid #1e2026; display: flex; justify-content: space-between; }
        .history-percent { font-weight: bold; color: #22c55e; }
    </style>
</head>

<body>

    <div class="header-container">
        <img src="images.jpg" alt="Demon Troll" class="site-logo" />
        <h1>DEMON ROULETTE</h1>
    </div>

    <div class="container">
        <div class="target-box">ЦЕЛЬ: <span id="target-percent">1</span>%</div>

        <div class="roulette-wrapper" id="roulette-window">
            <div class="selector-line"></div>
            <div id="status-overlay">ПОДКЛЮЧЕНИЕ К БАЗЕ...</div>
            <div id="roulette-track"></div>
        </div>

        <div class="controls">
            <button id="btn-roll" class="btn-roll" disabled>ЗАГРУЗКА...</button>
            <button id="btn-done" class="btn-done">ПРОЙДЕНО!</button>
        </div>

        <div class="history-panel">
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        const TABLE_ID = "984514";
        const API_TOKEN = "lLeay1kQEgI8lOf5IEhdSq7iHoqhHJCy";

        let demons = [];
        let currentTarget = 1;
        let currentLevel = null;
        let isRolling = false;

        const fallbackDemons = [
            { name: "Bloodbath", author: "by Riot", diff: "Extreme Demon" },
            { name: "Cataclysm", author: "by Ggb0y", diff: "Extreme Demon" },
            { name: "Nine Circles", author: "by Zobros", diff: "Hard Demon" },
            { name: "B", author: "by Motleyorc", diff: "Medium Demon" },
            { name: "Clubstep", author: "by RobTop", diff: "Easy Demon" }
        ];

        function getDiffClass(difficulty) {
            const d = difficulty.toLowerCase();
            if (d.includes("extreme")) return "extreme";
            if (d.includes("insane")) return "insane";
            if (d.includes("hard")) return "hard";
            if (d.includes("medium")) return "medium";
            return "easy";
        }

        async function loadDemons() {
            try {
                const response = await fetch(`https://api.baserow.io/api/database/rows/table/${TABLE_ID}/?user_field_names=true`, {
                    headers: { Authorization: `Token ${API_TOKEN}` }
                });
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                
                demons = data.results.map(level => ({
                    name: level.Name || "Без названия",
                    author: level.Author || "by Unknown",
                    diff: level.Difficulty || "Easy Demon",
                    class: getDiffClass(level.Difficulty || "")
                }));
                setReadyState();
            } catch (error) {
                demons = fallbackDemons.map(level => ({ ...level, class: getDiffClass(level.diff) }));
                document.getElementById("status-overlay").innerText = "ОШИБКА API • ОФФЛАЙН РЕЖИМ";
                setTimeout(setReadyState, 1500);
            }
        }

        function setReadyState() {
            document.getElementById("status-overlay").style.display = "none";
            document.getElementById("btn-roll").disabled = false;
            document.getElementById("btn-roll").innerText = "КРУТИТЬ КЕЙС";
            
            const track = document.getElementById("roulette-track");
            track.innerHTML = createCardHTML({name: "ГОТОВ?", author: "Жми кнопку", diff: "???", class: ""});
            track.style.justifyContent = "center";
            track.style.width = "100%";
        }

        function createCardHTML(level) {
            // Если карточка победная, цвет подсветится в JS после остановки
            return `
                <div class="demon-card ${level.class}">
                    <div class="level-name">${level.name}</div>
                    <div class="level-author">${level.author}</div>
                    <div class="diff-badge">${level.diff}</div>
                </div>
            `;
        }

        function rollDemon() {
            if (isRolling || currentTarget > 100) return;
            isRolling = true;

            const rollBtn = document.getElementById("btn-roll");
            const doneBtn = document.getElementById("btn-done");
            const track = document.getElementById("roulette-track");
            const windowEl = document.getElementById("roulette-window");

            rollBtn.disabled = true;
            doneBtn.style.display = "none";

            // 1. Мгновенно сбрасываем ленту в самое начало
            track.style.transition = "none";
            track.style.transform = "translateX(0px)";
            track.style.justifyContent = "flex-start";
            track.style.width = "max-content";
            
            // 2. Генерируем ленту предметов (60 карточек)
            const totalCards = 60; 
            const winningIndex = 52; // Какая по счету карточка выиграет
            const cardWidth = 220; // Точная ширина из CSS
            
            let trackHTML = "";
            for (let i = 0; i < totalCards; i++) {
                let lvl = demons[Math.floor(Math.random() * demons.length)];
                if (i === winningIndex) currentLevel = lvl;
                trackHTML += createCardHTML(lvl);
            }
            track.innerHTML = trackHTML;

            // 3. Форсируем перерисовку браузера (ВАЖНО ДЛЯ ПЛАВНОСТИ!)
            void track.offsetWidth; 

            // 4. Высчитываем, куда именно крутить
            const windowWidth = windowEl.clientWidth;
            const centerOffset = (windowWidth / 2) - (cardWidth / 2);
            
            // Рандомная остановка внутри самой карточки (чтобы не всегда ровно по центру)
            const randomNudge = Math.floor(Math.random() * (cardWidth - 20)) - ((cardWidth - 20) / 2);
            const finalPosition = (winningIndex * cardWidth) - centerOffset + randomNudge;

            // 5. Запускаем CS:GO анимацию (8 секунд, кубик-безье для плавного торможения)
            track.style.transition = "transform 8s cubic-bezier(0.1, 0.9, 0.1, 1)";
            track.style.transform = `translateX(-${finalPosition}px)`;

            // 6. Ждем 8 секунд, пока рулетка полностью остановится
            setTimeout(() => {
                isRolling = false;
                rollBtn.disabled = false;
                rollBtn.innerText = "СКИП (ПЕРЕКРУТИТЬ)";
                doneBtn.style.display = "inline-block";
                
                // Подсвечиваем выигранную карточку зелёным
                const winnerCard = document.querySelectorAll('.demon-card')[winningIndex];
                winnerCard.style.background = "radial-gradient(circle, rgba(34,197,94,0.3) 0%, rgba(0,0,0,0) 100%)";
                
            }, 8000); 
        }

        function completeLevel() {
            if (!currentLevel) return;

            const history = document.getElementById("history-list");
            history.innerHTML = `
                <div class="history-item">
                    <span>${currentLevel.name}</span>
                    <span class="history-percent">${currentTarget}%</span>
                </div>
            ` + history.innerHTML;

            currentTarget++;
            document.getElementById("target-percent").innerText = currentTarget > 100 ? "GG!" : currentTarget;
            document.getElementById("btn-done").style.display = "none";
            document.getElementById("btn-roll").innerText = "КРУТИТЬ КЕЙС";
        }

        window.onload = loadDemons;
    </script>
</body>
</html>
