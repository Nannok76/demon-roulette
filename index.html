<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GD Demon Roulette</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .site-logo {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.7));
        }

        h1 {
            font-family: 'Righteous', cursive;
            color: #ffcc00;
            font-size: 40px;
            text-shadow: 3px 3px 0px #000, 0 0 15px rgba(255, 204, 0, 0.5);
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(30, 30, 40, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
            border: 3px solid #334155;
            backdrop-filter: blur(5px);
        }

        .target-box {
            background: #000;
            border: 2px solid #ffcc00;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 12px;
            font-family: 'Righteous', cursive;
            font-size: 24px;
            color: #ffcc00;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(255, 204, 0, 0.3);
        }

        #roulette-box {
            margin: 20px 0;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #475569;
            transition: all 0.3s ease;
        }

        .level-name {
            font-family: 'Righteous', cursive;
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 2px 2px #000;
            word-break: break-word;
        }

        .level-author {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        .difficulty {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 5px 15px;
            border-radius: 8px;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.5);
            border: 1px solid currentColor;
        }

        .extreme { color: #ff3333; text-shadow: 0 0 5px #ff3333; }
        .insane { color: #ff33ff; text-shadow: 0 0 5px #ff33ff; }
        .hard { color: #ff6666; text-shadow: 0 0 5px #ff6666; }
        .medium { color: #ffcc66; text-shadow: 0 0 5px #ffcc66; }
        .easy { color: #66ccff; text-shadow: 0 0 5px #66ccff; }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Righteous', cursive;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
            text-transform: uppercase;
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-roll {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 6px #1d4ed8;
        }
        .btn-roll:active:not(:disabled) { transform: translateY(6px); box-shadow: none; }

        .btn-done {
            background-color: #22c55e;
            color: white;
            box-shadow: 0 6px #15803d;
            display: none;
        }
        .btn-done:active { transform: translateY(6px); box-shadow: none; }

        .history-panel {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .history-panel h3 { margin-top: 0; text-align: center; }
        .history-item { padding: 8px 10px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; gap: 10px; }
        .history-percent { font-weight: bold; color: #ffcc00; }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="images.jpg" alt="Demon Troll" class="site-logo" />
        <h1>DEMON ROULETTE</h1>
    </div>

    <div class="container">
        <div class="target-box">ЦЕЛЬ: <span id="target-percent">1</span>%</div>

        <div id="roulette-box">
            <div id="status-text" class="level-name">Загрузка демонов...</div>
        </div>

        <div class="controls">
            <button id="btn-roll" class="btn-roll" disabled>Загрузка...</button>
            <button id="btn-done" class="btn-done">Пройдено!</button>
        </div>

        <div class="history-panel">
            <h3>ИСТОРИЯ ПРОХОЖДЕНИЙ</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        const TABLE_ID = "984514";
        const API_TOKEN = "lLeay1kQEgI8lOf5IEhdSq7iHoqhHJCy";

        let demons = [];
        let currentTarget = 1;
        let currentLevel = null;
        let isRolling = false;

        const fallbackDemons = [
            { name: "Bloodbath", author: "by Riot", diff: "Extreme Demon" },
            { name: "Cataclysm", author: "by Ggb0y", diff: "Extreme Demon" },
            { name: "Acu", author: "by Neigefeu", diff: "Extreme Demon" },
            { name: "Nine Circles", author: "by Zobros", diff: "Hard Demon" },
            { name: "B", author: "by Motleyorc", diff: "Medium Demon" },
            { name: "Clubstep", author: "by RobTop", diff: "Easy Demon" },
            { name: "Theory of Skrillex", author: "by Suomi", diff: "Insane Demon" }
        ];

        function getDiffClass(difficulty) {
            const d = difficulty.toLowerCase();
            if (d.includes("extreme")) return "extreme";
            if (d.includes("insane")) return "insane";
            if (d.includes("hard")) return "hard";
            if (d.includes("medium")) return "medium";
            return "easy";
        }

        function prepareDemons(list) {
            return list.map(level => ({
                name: level.name || level.Name || "Без названия",
                author: level.author || level.Author || "by Unknown",
                diff: level.diff || level.Difficulty || "Easy Demon",
                class: getDiffClass(level.diff || level.Difficulty || "Easy Demon")
            }));
        }

        async function loadDemons() {
            try {
                const response = await fetch(
                    `https://api.baserow.io/api/database/rows/table/${TABLE_ID}/?user_field_names=true`,
                    { headers: { Authorization: `Token ${API_TOKEN}` } }
                );
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                if (!data.results || data.results.length === 0) throw new Error("Empty database");
                demons = prepareDemons(data.results);
                setReadyState();
            } catch (error) {
                demons = prepareDemons(fallbackDemons);
                document.getElementById("status-text").innerText = "API недоступен • Используется локальная база";
                setTimeout(setReadyState, 1200);
            }
        }

        function setReadyState() {
            const box = document.getElementById("roulette-box");
            box.innerHTML = '<div id="status-text" class="level-name">Нажми «КРУТИТЬ»</div>';
            box.style.borderColor = '#475569';
            
            const rollBtn = document.getElementById("btn-roll");
            rollBtn.disabled = false;
            rollBtn.innerText = "КРУТИТЬ";
        }

        function showLevel(level) {
            document.getElementById("roulette-box").innerHTML = `
                <div class="level-name">${level.name}</div>
                <div class="level-author">${level.author}</div>
                <div class="difficulty ${level.class}">${level.diff}</div>
            `;
            document.getElementById("roulette-box").style.borderColor = '#ffcc00';
        }

        function randomLevel() {
            return demons[Math.floor(Math.random() * demons.length)];
        }

        function rollDemon() {
            if (isRolling) return;
            if (currentTarget > 100) return;
            if (demons.length === 0) return;

            isRolling = true;
            const rollBtn = document.getElementById("btn-roll");
            const doneBtn = document.getElementById("btn-done");
            const box = document.getElementById("roulette-box");

            rollBtn.disabled = true;
            doneBtn.style.display = "none";
            box.style.borderColor = '#475569';

            let counter = 0;
            const interval = setInterval(() => {
                const temp = randomLevel();
                box.innerHTML = `<div class="level-name" style="color: #fff;">${temp.name}</div>`;
                counter++;

                if (counter >= 15) {
                    clearInterval(interval);
                    currentLevel = randomLevel();
                    showLevel(currentLevel);
                    
                    isRolling = false;
                    rollBtn.disabled = false;
                    rollBtn.innerText = "ПЕРЕКРУТИТЬ (СКИП)";
                    doneBtn.style.display = "inline-block";
                }
            }, 60);
        }

        function completeLevel() {
            if (!currentLevel) return;

            const history = document.getElementById("history-list");
            const shortDiff = currentLevel.diff.split(' ')[0];
            
            history.innerHTML = `
                <div class="history-item">
                    <span><span class="difficulty ${currentLevel.class}" style="font-size:10px; padding:2px 5px; margin-right:8px;">${shortDiff}</span> ${currentLevel.name}</span>
                    <span class="history-percent">${currentTarget}%</span>
                </div>
            ` + history.innerHTML;

            currentTarget++;

            if (currentTarget > 100) {
                document.getElementById("target-percent").innerText = "GG!";
                document.getElementById("roulette-box").innerHTML = `<div class="level-name" style="color: #22c55e;">РУЛЕТКА ПРОЙДЕНА!</div>`;
                document.getElementById("btn-roll").style.display = "none";
                document.getElementById("btn-done").style.display = "none";
            } else {
                document.getElementById("target-percent").innerText = currentTarget;
                document.getElementById("roulette-box").innerHTML = `<div id="status-text" class="level-name" style="color: #94a3b8;">ГОТОВ К ${currentTarget}%?</div>`;
                document.getElementById("roulette-box").style.borderColor = '#475569';
                document.getElementById("btn-done").style.display = "none";
                document.getElementById("btn-roll").innerText = "КРУТИТЬ";
                currentLevel = null;
            }
        }

        document.getElementById("btn-roll").addEventListener("click", rollDemon);
        document.getElementById("btn-done").addEventListener("click", completeLevel);

        window.onload = loadDemons;
    </script>
</body>
</html>
